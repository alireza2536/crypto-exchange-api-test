name: Keep Render test service awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-test-service-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render health endpoint
        env:
          HEALTH_URL: https://exchange-api-connectivity-test.onrender.com/health?source=github-actions
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 20 \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL" >/dev/null
          echo "Render health endpoint responded successfully."
