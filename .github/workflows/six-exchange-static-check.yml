name: Six-exchange static check

on:
  push:
    branches:
      - remove-htx-six-exchange-audit

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: node --check server.js
