name: Validate OI collector entry filters

on:
  push:
    branches: [main, permanent-stablecoin-price-entry-filters]
  pull_request:
    branches: [main]

jobs:
  syntax-and-policy-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - name: Verify permanent entry-policy guards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('server.js', 'utf8');
          const required = [
            'MAX_BASE_ASSET_PRICE_USD = 30',
            'STABLECOIN_BASE_ASSETS',
            'entryEligible(exchange,',
            'asset_price_usd',
            'base_asset',
            '/openApi/swap/v2/quote/ticker',
            '/api/v5/market/tickers?instType=SWAP',
            '/api/v1/allTickers',
            '/capi/v3/market/ticker/24hr',
            '/future/market/v1/public/q/tickers'
          ];
          const missing = required.filter(value => !source.includes(value));
          if (missing.length) {
            console.error('Missing entry-policy guard(s):', missing);
            process.exit(1);
          }
          console.log('All six-exchange entry-policy guards are present.');
          NODE
